name: Feature request
description: A change to the CLI, reports, or docs
title: "[feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Features that scan, brute-force, or log in are out of scope. See
        docs/ethics.md.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is hard or missing today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What should the command or the report do?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: Other ways you considered, including doing it outside ReconLens.
  - type: checkboxes
    id: passive
    attributes:
      label: Scope check
      options:
        - label: This stays passive (no port scans, brute force, or login attempts)
          required: true
