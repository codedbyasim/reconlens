[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "reconlens"
dynamic = ["version"]
description = "Passive, ethical OSINT reconnaissance for domains, IPs, emails, and usernames."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Muhammad Asim" }]
keywords = [
    "osint",
    "recon",
    "reconnaissance",
    "dns",
    "security",
    "cli",
    "passive",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Typing :: Typed",
]
dependencies = [
    "cryptography>=42",
    "dnspython>=2.6.1",
    "httpx>=0.27",
    "rich>=13.7",
    "tomli>=2.0.1",
    "typer>=0.12",
]

[project.optional-dependencies]
dev = [
    "jsonschema>=4.22",
    "mypy>=1.11",
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "respx>=0.21",
    "ruff>=0.6",
]
docs = ["mkdocs-material>=9.5"]

[project.urls]
Homepage = "https://github.com/codedbyasim/reconlens"
Repository = "https://github.com/codedbyasim/reconlens"
Documentation = "https://github.com/codedbyasim/reconlens/tree/main/docs"
Issues = "https://github.com/codedbyasim/reconlens/issues"
Changelog = "https://github.com/codedbyasim/reconlens/blob/main/CHANGELOG.md"

[project.scripts]
reconlens = "reconlens.cli:app"

[project.entry-points."reconlens.sources"]
dns = "reconlens.plugins.dns_records:DnsSource"
rdap = "reconlens.plugins.rdap_whois:RdapSource"
crtsh = "reconlens.plugins.crtsh:CrtShSource"
ssl = "reconlens.plugins.ssl_cert:SslCertSource"
http-headers = "reconlens.plugins.http_headers:HttpHeadersSource"
robots = "reconlens.plugins.robots_security:RobotsSecuritySource"
ip-geo = "reconlens.plugins.ip_geo:IpGeoSource"
ripestat = "reconlens.plugins.ripestat:RipeStatSource"
wayback = "reconlens.plugins.wayback:WaybackSource"
username = "reconlens.plugins.username_sites:UsernameSource"
email-auth = "reconlens.plugins.email_auth:EmailAuthSource"
gravatar = "reconlens.plugins.gravatar:GravatarSource"
virustotal = "reconlens.plugins.virustotal:VirusTotalSource"
abuseipdb = "reconlens.plugins.abuseipdb:AbuseIpdbSource"
urlscan = "reconlens.plugins.urlscan:UrlscanSource"
shodan = "reconlens.plugins.shodan:ShodanSource"
hibp = "reconlens.plugins.hibp:HibpSource"

[tool.hatch.version]
path = "src/reconlens/version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/reconlens"]

[tool.hatch.build.targets.wheel.force-include]
"src/reconlens/data/username_sites.json" = "reconlens/data/username_sites.json"
"src/reconlens/py.typed" = "reconlens/py.typed"

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["src", "tests"]

[tool.ruff.format]
exclude = ["*.md", "**/*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"src/reconlens/cli.py" = ["B008"]

[tool.ruff.lint.isort]
known-first-party = ["reconlens"]

[tool.mypy]
python_version = "3.10"
strict = true
pretty = true
show_error_codes = true
warn_unreachable = true
mypy_path = "src"
packages = ["reconlens"]

[[tool.mypy.overrides]]
module = ["dns", "dns.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]
addopts = ["-q", "--strict-markers"]

[tool.coverage.run]
branch = true
source = ["reconlens"]
omit = [
    "*/reconlens/__main__.py",
    "*/reconlens/plugins/_template.py",
]

[tool.coverage.report]
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
